<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主的旨意</title>
<meta name="description" content="把你的煩惱交給主。祂會用經文回答你。">
<meta name="theme-color" content="#050403">
<link rel="stylesheet" href="assets/style.css">
<noscript><style>.mute,.hint{display:none}</style></noscript>
</head>
<body>
<div class="fog" aria-hidden="true"><i></i><i></i></div>
<div class="candles" aria-hidden="true"><i></i><i></i></div>
<div id="beams" class="beams" aria-hidden="true"></div>
<canvas id="dust" class="dust" aria-hidden="true"></canvas>
<canvas id="scene" class="scene" aria-hidden="true"></canvas>

<button type="button" id="mute" class="mute" aria-pressed="false" aria-label="靜音">♪</button>

<main class="page">
  <header class="masthead">
    <div class="rule"></div>
    <h1>主 的 旨 意</h1>
    <p class="subtitle">凡勞苦擔重擔的人、可以到這裡來</p>
    <div class="rule"></div>
  </header>

  <footer class="colophon">
    <p>經文引自和合本，一字未改。</p>
  </footer>
</main>

<p id="cross-hint" class="cross-hint" aria-hidden="true">點擊這裡<span class="arrow">↓</span></p>
<button type="button" id="cross" class="cross" aria-label="點擊十字架，向主求問"></button>

<dialog id="ask-dialog" class="ask-dialog" aria-labelledby="dialog-title">
  <div class="dialog-head">
    <h2 id="dialog-title">向主求問</h2>
    <button type="button" id="close-dialog" class="close" aria-label="關閉">×</button>
  </div>

  <form id="ask-form" class="ask" autocomplete="off">
    <label for="question" class="visually-hidden">你的煩惱</label>
    <input id="question" name="question" type="text" maxlength="100"
           placeholder="說出你的煩惱⋯⋯">
    <button type="submit">求 問</button>
  </form>

  <p id="notice" class="notice" role="status" tabindex="-1" aria-live="polite" hidden></p>

  <section id="answer" class="answer" hidden>
    <p class="asked">你問：<span id="asked-text"></span></p>
    <blockquote id="verse-text" class="verse"></blockquote>
    <cite id="verse-ref" class="ref"></cite>
    <p id="quip" class="quip"></p>
    <div class="actions">
      <button type="button" id="again">再 求 一 次</button>
      <button type="button" id="save">存 成 圖 片</button>
    </div>
  </section>
</dialog>

<p id="hint" class="hint" role="status" hidden>觸碰任一處，聆聽聖樂</p>
<script type="module" src="assets/app.js"></script>
</body>
</html>
