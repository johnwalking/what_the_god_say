<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主的旨意</title>
<meta name="description" content="把你的煩惱交給主。祂會用經文回答你。">
<meta name="theme-color" content="#0b0907">
<link rel="stylesheet" href="assets/style.css">
<noscript><style>#gate{display:none}.mute{display:none}</style></noscript>
</head>
<body>
<div id="rose-window" class="rose-window" aria-hidden="true"></div>
<div id="beams" class="beams" aria-hidden="true"></div>
<canvas id="dust" class="dust" aria-hidden="true"></canvas>

<button type="button" id="mute" class="mute" aria-pressed="false" aria-label="靜音" hidden>♪</button>

<main class="page">
  <header class="masthead">
    <div class="rule"></div>
    <h1>主 的 旨 意</h1>
    <p class="subtitle">凡勞苦擔重擔的人、可以到這裡來</p>
    <div class="rule"></div>
  </header>

  <form id="ask-form" class="ask" autocomplete="off">
    <label for="question" class="visually-hidden">你的煩惱</label>
    <input id="question" name="question" type="text" maxlength="100"
           placeholder="說出你的煩惱⋯⋯">
    <button type="submit">求 問</button>
  </form>

  <p id="notice" class="notice" role="status" tabindex="-1" aria-live="polite" hidden></p>

  <section id="answer" class="answer" hidden>
    <p class="asked">你問：<span id="asked-text"></span></p>
    <blockquote id="verse-text" class="verse"></blockquote>
    <cite id="verse-ref" class="ref"></cite>
    <p id="quip" class="quip"></p>
    <div class="actions">
      <button type="button" id="again">再 求 一 次</button>
      <button type="button" id="save">存 成 圖 片</button>
    </div>
  </section>

  <footer class="colophon">
    <p>經文引自和合本，一字未改。</p>
  </footer>
</main>

<div id="gate" class="gate" role="dialog" aria-modal="true" aria-label="進入聖殿">
  <div class="gate-curtain gate-left"></div>
  <div class="gate-curtain gate-right"></div>
  <div class="gate-body">
    <div class="gate-cross" aria-hidden="true"></div>
    <div class="gate-actions">
      <button type="button" id="enter-sound">進入聖殿</button>
      <button type="button" id="enter-silent" class="quiet">靜默進入</button>
    </div>
  </div>
</div>
<script type="module" src="assets/app.js"></script>
<script>
// 後備：app.js 載入失敗（模組錯誤、舊瀏覽器、CSP、404）時，入口不能永遠擋住頁面
setTimeout(function () {
  if (window.__sanctuaryReady) return;
  var gate = document.getElementById('gate');
  if (gate) gate.hidden = true;
  var main = document.querySelector('main.page');
  if (main) main.removeAttribute('inert');
}, 4000);
</script>
</body>
</html>
